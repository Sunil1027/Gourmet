<!DOCTYPE HTML>
<html>
<head>
<title>Add Review Page</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body class="container">

	<header class="d-flex align-items-center p-3 bg-light border-bottom">

		<div class="me-auto">
			<a th:href="@{/restaurant}"
				class="text-dark text-decoration-none fs-3 font-weight-bold"
				style="font-family: 'Helvetica Neue', Arial, sans-serif; letter-spacing: 0.5px;">
				Gourmet Clip </a>
		</div>

		<div class="d-flex align-items-center">
			<div class="me-3 font-weight-bold">
				<a
					th:href="${#authorization.expression('hasRole(''ADMIN'')')} ? @{/admin/users} : @{/user-home}"
					class="text-secondary text-decoration-none"> ユーザーID: <span
					th:text="${#authentication.name}">userId</span>
				</a>
			</div>

			<div class="me-3">
				<a th:href="@{/restaurant}" class="btn btn-outline-secondary btn-sm"
					style="font-weight: bold;"> &larr; 飲食店一覧へ </a>
			</div>

			<div class="me-3" sec:authorize="hasRole('ADMIN')">
				<a th:href="@{/admin/users}"
					class="btn btn-link btn-sm text-decoration-none"
					style="font-weight: bold; color: #6c757d;">ユーザー管理</a>
			</div>

			<div>
				<a th:href="@{/logout}" class="btn btn-danger btn-sm">ログアウト</a>
			</div>
		</div>

	</header>


	<h1 class="display-4 mb-4">投稿内容の確認</h1>
	<p class="mb-4">以下の内容でレビューを投稿します。よろしければ「確定する」ボタンを押してください。</p>

	<div class="card mb-4 bg-light">
		<div class="card-body">
			<h5 class="card-title" th:text="${restaurant.restaurantName}">レストラン名表示</h5>
			<p class="card-text text-muted">
				<small>レストランID: <span th:text="${restaurant.id}">0</span></small>
			</p>
		</div>
	</div>

	<form
		th:action="@{/restaurant/{restaurantId}/review/register(restaurantId=${restaurant.id})}"
		th:object="${reviewForm}" method="post">

		<input type="hidden" th:each="name : ${fieldNames}"
			th:field="*{__${name}__}" />

		<div class="table-responsive mb-4">
			<table class="table table-bordered align-middle mb-0">
				<thead class="table-secondary">
					<tr>
						<th th:each="jpName : ${fieldJapaneseNames}"
							th:if="${jpName != 'レビュー内容' and jpName != 'コメント'}"
							th:text="${jpName}" style="width: 25%;" class="small py-2">項目名</th>
					</tr>
				</thead>

				<tbody>
					<tr>
						<td th:each="name : ${fieldNames}" th:if="${name != 'comment'}">
							<span th:text="*{__${name}__}"
							th:classappend="${name == 'rating'} ? 'text-warning fw-bold' : ''">値</span>
						</td>
					</tr>

					<tr>
						<td colspan="10" class="bg-light-subtle px-3 py-3"><small
							class="text-secondary d-block mb-1">コメント：</small> <span
							style="white-space: pre-wrap;" th:text="*{comment}">コメントの内容</span>
						</td>
					</tr>
				</tbody>
			</table>
		</div>

		<div class="mt-4 mb-5">
			<button type="submit" class="btn btn-success px-4">この内容で確定する</button>
			<button type="button" class="btn btn-outline-secondary ms-2"
				onclick="history.back()">修正する</button>
		</div>
	</form>

</body>

</html>
