<!DOCTYPE HTML>
<html>
<head>
<title>Add Review Page</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body class="container">
	<style>
.err {
	color: red
}
</style>

	<header class="d-flex align-items-center p-3 bg-light border-bottom">

		<div class="me-auto">
			<a th:href="@{/restaurant}"
				class="text-dark text-decoration-none fs-3 font-weight-bold"
				style="font-family: 'Helvetica Neue', Arial, sans-serif; letter-spacing: 0.5px;">
				Gourmet Clip </a>
		</div>

		<div class="d-flex align-items-center">
			<div class="me-3 font-weight-bold">
				<a
					th:href="${#authorization.expression('hasRole(''ADMIN'')')} ? @{/admin/users} : @{/user-home}"
					class="text-secondary text-decoration-none"> ユーザーID: <span
					th:text="${#authentication.name}">userId</span>
				</a>
			</div>
			<div class="me-3">
				<a th:href="@{/restaurant}" class="btn btn-outline-secondary btn-sm"
					style="font-weight: bold;"> &larr; 飲食店一覧へ </a>
			</div>

			<div class="me-3" sec:authorize="hasRole('ADMIN')">
				<a th:href="@{/admin/users}"
					class="btn btn-link btn-sm text-decoration-none"
					style="font-weight: bold; color: #6c757d;">ユーザー管理</a>
			</div>

			<div>
				<a th:href="@{/logout}" class="btn btn-danger btn-sm">ログアウト</a>
			</div>
		</div>

	</header>






	<h1 class="display-4 mb-4" th:text="${title}"></h1>
	<p th:text="${msg}"></p>


	<div class="card mb-4">
		<div class="card-body">
			<h5 class="card-title" th:text="${restaurant.restaurantName}">レストラン名表示</h5>
			<p class="card-text text-muted">
				<small>レストランID: <span th:text="${restaurant.id}">0</span></small>
			</p>
		</div>
	</div>

	<form
		th:action="@{/restaurant/{restaurantId}/review/confirm(restaurantId=${restaurant.id})}"
		th:object="${reviewForm}" method="post">
		<!-- 
    <input type="hidden" name="restaurant" th:value="${restaurant}" />
     -->

		<div class="mb-3" th:each="fieldName, stat : ${fieldNames}">

			<label class="form-label"
				th:text="${fieldJapaneseNames.get(stat.index)}"></label>

			<div th:switch="${fieldName}">

				<select th:case="'rating'" class="form-select" th:field="*{rating}"
					required>
					<option value="5">5（大満足）</option>
					<option value="4">4（満足）</option>
					<option value="3" selected>3（普通）</option>
					<option value="2">2（微妙）</option>
					<option value="1">1（残念）</option>
				</select>

				<textarea th:case="'comment'" class="form-control"
					th:field="*{comment}" rows="5" placeholder="レビュー内容を入力してください"></textarea>

				<input th:case="'userId'" type="text" class="form-control"
					name="userId" th:value="${#vars.loginUserId}" readonly /> <input
					th:case="*" type="text" class="form-control"
					th:field="*{__${fieldName}__}" required />

			</div>
		</div>

		<button type="submit" class="btn btn-primary mt-3">レビューを投稿する</button>
		<a th:href="${cancelUrl} ?: @{/restaurant}"
			class="btn btn-outline-secondary mt-3 ms-2"> Cancel</a>

	</form>


</body>


</html>
