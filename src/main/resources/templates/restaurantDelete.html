<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>飲食店削除確認</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">⚠️ 飲食店の削除確認</h4>
            </div>
            <div class="card-body">
                <p class="text-danger fw-bold">以下の飲食店データを完全に削除します。よろしいですか？</p>
                <hr>
                <div class="mb-3">
                    <label class="form-label text-muted">店舗ID</label>
                    <p class="fs-5 fw-bold" th:text="${targetRestaurant.id}"></p>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted">店舗名</label>
                    <p class="fs-5 fw-bold text-dark" th:text="${targetRestaurant.restaurantName}"></p>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted">住所</label>
                    <p class="fs-6" th:text="${targetRestaurant.storingPlace}"></p>
                </div>
                <hr>
                <form th:action="@{/admin/a_restaurants/delete/{id}(id=${targetRestaurant.id})}" method="post">
                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/admin/a_restaurants}" class="btn btn-secondary">キャンセルして戻る</a>
                        <button type="submit" class="btn btn-danger">本当に削除する</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
