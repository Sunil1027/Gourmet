<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<title>飲食店管理（管理者用）</title>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		.err { color: red }
	</style>
</head>
<body class="container">

	<header class="d-flex align-items-center p-3 bg-light border-bottom mb-4">
		<div class="me-auto">
			<a th:href="@{/admin/users}" class="text-dark text-decoration-none fs-3 font-weight-bold" style="font-family: 'Helvetica Neue', Arial, sans-serif; letter-spacing: 0.5px;">
				Gourmet Clip <span class="fs-6 text-secondary">(管理者用)</span>
			</a>
		</div>

		<div class="d-flex align-items-center">
			<div class="me-3 text-secondary font-weight-bold">
				ユーザーID: <span sec:authentication="name"></span>
			</div>

			<div class="me-3">
				<a th:href="@{/admin/users}" class="btn btn-outline-secondary btn-sm" style="font-weight: bold;">
					&larr; ユーザー管理へ
				</a>
			</div>

			<div>
				<a th:href="@{/logout}" class="btn btn-danger btn-sm">ログアウト</a>
			</div>
		</div>
	</header>

	<h1 class="display-5 mb-4">全飲食店一覧</h1>

	<div class="card p-3 mb-4 bg-light">
		<form method="get" action="/admin/a_restaurants/search">
			<div class="input-group">
				<span class="input-group-text">キーワード：</span>
				<input type="text" class="form-control me-1" name="keyword" th:value="${keywordValue}" placeholder="店舗名や住所を入力" />
				<span class="input-group-btn d-flex gap-1">
					<input type="submit" class="btn btn-primary px-4" value="検索" />
					<a th:href="@{/admin/a_restaurants}" class="btn btn-outline-danger px-3 d-flex align-items-center">検索解除</a>
				</span>
			</div>
		</form>
	</div>

	<table class="table table-bordered table-hover align-middle">
		<thead class="table-light">
			<tr>
				<th>ID</th>
				<th>店舗名</th>
				<th>ジャンル</th>
				<th>住所</th>
				<th style="text-align: center; width: 150px;">操作</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="item : ${data}">
				<td th:text="${item.id}"></td>
				<td><strong th:text="${item.restaurantName}"></strong></td>
				<td th:text="${item.genre}"></td>
				<td th:text="${item.storingPlace}"></td>
				<td class="text-center">
					<div class="d-flex gap-1 justify-content-center">
						<a class="btn btn-success btn-sm" th:href="@{/restaurants/detail/{id}(id=${item.id})}">
							詳細
						</a>
						<a class="btn btn-danger btn-sm" th:href="@{/a_restaurants/delete/{id}(id=${item.id})}">
							削除
						</a>
					</div>
				</td>
			</tr>
		</tbody>
	</table>

</body>
</html>
